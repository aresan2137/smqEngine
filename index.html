<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>game</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            display: block;
            margin: auto;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            width: 100% !important;
            height: auto !important;
            max-height: 100vh !important;
            max-width: calc(100vh * (16 / 9)) !important;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            outline: none;
        }
    </style>
</head>
<body>
    <script type="module">
        import init from './pkg/smq_game_lib.js';

        init().catch((error) => {
            console.error("error:", error);
        });
    </script>
</body>
</html>
