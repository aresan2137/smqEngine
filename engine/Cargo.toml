[package]
name = "smq_engine"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
winit = "0.30.0"
glam = { version = "0.29", features = ["bytemuck"] }
bevy_ecs = "0.19"
wgpu = "24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4.0"
web-time = "1.1"
log = "0.4"
flate2 = "1.0"
egui = { version = "0.31" }
egui-winit = { version = "0.31", default-features = false, features = ["links"]}
egui-wgpu = { version = "0.31" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Node"] }
wasm-bindgen-futures = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true