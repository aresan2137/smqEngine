[package]
name = "smq_game"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"

[dependencies]
smq_engine = { path = "../engine" }

winit = "0.30.0"
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bevy_ecs = "0.19"
wgpu = "24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1.21", features = ["derive"] }
pollster = "0.4.0"
web-time = "1.1"
egui = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
egui-winit = { version = "0.31", default-features = false, features = ["links"] }
egui-wgpu = "0.31"
log = "0.4"

wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Node"] }
wasm-bindgen-futures = "0.4"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false