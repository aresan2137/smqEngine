[package]
name = "smq_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
smq_engine = { path = "../engine" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gltf = "1.4"
egui_dock = { version = "0.21", features = ["serde"] }
meval = "0.2"
rfd = "0.14"
uuid = { version = "1.7", features = ["v4", "serde"] }
trash = "3.3"
walkdir = "2.0"
bincode = "1.3"
flate2 = "1.0"
winit = "0.30.0"
glam = { version = "0.33.6", features = ["bytemuck"] }
wgpu = "30.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4.0"
log = "0.4"
egui = { version = "0.36" }
egui-winit = { version = "0.36", default-features = false, features = ["links"]}
egui-wgpu = { version = "0.36" }
bevy_ecs = "0.19"
web-time = "1.1"